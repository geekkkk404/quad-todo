name: sync-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "47 20 * * 1" # UTC 每周一 20:47（北京时间周二 04:47）兜底，避开整点拥塞

permissions:
  contents: write

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史与标签，镜像需要全部 refs

      - name: Mirror push to Gitee
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          R="https://geekkkk404:${TOKEN}@gitee.com/geekkkk404/quad-todo.git"
          # 用 origin/main 引用而非本地分支名，保证 tag 触发（detached HEAD）时同样可用
          git push --force "$R" "origin/main:refs/heads/main"
          git push --force "$R" "+refs/tags/*:refs/tags/*"

  build-portable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download matching embeddable Python
        shell: pwsh
        run: |
          $v = (python -c "import platform;print(platform.python_version())").Trim()
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile embed.zip

      - name: Build portable zip
        run: python scripts/build_portable.py --embeddable-zip embed.zip

      - name: Write release notes
        run: python scripts/make_notes.py "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

      - name: Create GitHub release & upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist -Filter *.zip | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" "$zip" --title "QuadTodo ${{ github.ref_name }}" --notes-file dist/RELEASE.md
          if ($LASTEXITCODE -ne 0) { gh release upload "${{ github.ref_name }}" "$zip" --clobber }

  gitee-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sync, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create Gitee release & upload zip
        # GitHub 机房到 Gitee 的大文件上传常超时：发行版+说明必成，附件尽力而为
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ZIP=$(find dist -name "*.zip" | head -1)
          python scripts/gitee_release.py "${{ github.ref_name }}" "$ZIP" dist/RELEASE.md

      - name: Fallback: publish zip to Gitee dist branch
        # git 协议走 sync 同款通道，通常能过大文件；raw 直链下载，成本一条分支
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ZIP=$(find dist -name "*.zip" | head -1)
          mkdir distrepo && cd distrepo
          git init -q -b dist
          git config user.email "quad-todo-ci@users.noreply.github.com"
          git config user.name "quad-todo-ci"
          cp "../$ZIP" .
          git add -A
          git commit -qm "portable zip for ${{ github.ref_name }}"
          git remote add gitee "https://geekkkk404:${TOKEN}@gitee.com/geekkkk404/quad-todo.git"
          git push -f gitee dist
